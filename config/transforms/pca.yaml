# @package _global_
to_tensor:
  _target_: emg2qwerty.transforms.ToTensor
  fields: [emg_left, emg_right]

pca_projection:
  _target_: emg2qwerty.transforms.PCAProjection
  components_path: analysis/pca_components_left.npy
  mean_path: analysis/pca_mean_left.npy
  components_path_right: analysis/pca_components_right.npy
  mean_path_right: analysis/pca_mean_right.npy
  k: 8

temporal_jitter:
  _target_: emg2qwerty.transforms.TemporalAlignmentJitter
  max_offset: 120

logspec:
  _target_: emg2qwerty.transforms.LogSpectrogram
  n_fft: 64
  hop_length: 16

specaug:
  _target_: emg2qwerty.transforms.SpecAugment
  n_time_masks: 3
  time_mask_param: 25
  n_freq_masks: 2
  freq_mask_param: 4

transforms:
  train:
    - ${to_tensor}
    - ${pca_projection}
    - ${temporal_jitter}
    - ${logspec}
    - ${specaug}

  val:
    - ${to_tensor}
    - ${pca_projection}
    - ${logspec}

  test: ${transforms.val}
